org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
flutter.treeShakeIcons=true
extra-gen-snapshot-options=--obfuscate
android.enableR8.fullMode=true
android.bundle.enableUncompressedNativeLibs=true
# AGP 9 reads only the new DSL / built-in Kotlin by default. Flutter plugins
# still need the legacy path — these two flags are what the Flutter migrator
# writes locally ("Upgrading gradle.properties").
android.newDsl=false
android.builtInKotlin=false