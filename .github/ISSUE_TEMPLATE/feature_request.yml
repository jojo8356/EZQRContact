name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: What is painful today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      placeholder: What should the app do instead? Keep it local-first.
    validations:
      required: true
