name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # flutter-version-file cannot parse constraints like ">=3.47.0".
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build
          test -f lib/data/db/database.g.dart

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze | tee analyze.log; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('analyze.log').read_text(errors='replace').splitlines()
          issues = [ln.strip() for ln in lines if ' • ' in ln]
          print(f'::notice::{len(issues)} analyze issues')
          chunk = 8
          for i in range(0, len(issues), chunk):
              blob = ' | '.join(issues[i:i+chunk]).replace('\n', ' ')
              print(f'::error::analyze[{i//chunk}] {blob}')
          PY
            exit 1
          fi

      - name: Test
        run: flutter test --reporter=compact
