name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # flutter-version-file cannot parse constraints like ">=3.47.0".
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          set -euo pipefail
          flutter pub run build_runner build --delete-conflicting-outputs | tee build_runner.log
          echo "::notice::br=$(tail -40 build_runner.log | tr '\n' ' | ')"
          echo "::notice::cache=$(find .dart_tool -name 'database.g.dart' -o -name 'database.drift.dart' 2>/dev/null | tr '\n' ' | ')"
          if [[ ! -f lib/data/db/database.g.dart ]]; then
            cached="$(find .dart_tool -name 'database.g.dart' 2>/dev/null | head -1 || true)"
            if [[ -n "${cached}" ]]; then
              cp "${cached}" lib/data/db/database.g.dart
              echo "::notice::copied=${cached}"
            fi
          fi
          echo "::notice::db dir=$(ls -la lib/data/db/ | tr '\n' ' | ')"
          test -f lib/data/db/database.g.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=compact
