name: qr_code_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# License: MIT (see LICENSE file at repo root)
version: 1.1.0+3

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  ai_barcode_scanner: ^8.2.0
  collection: ^1.19.1
  drift: ^2.33.0
  drift_sqflite: ^2.0.1
  file_picker: ^13.1.0
  file_saver: ^0.7.0
  flex_color_picker: ^4.0.0
  flutter:
    sdk: flutter
  flutter_contacts: ^2.6.0
  flutter_markdown: ^0.7.7+1
  font_awesome_flutter: ^11.0.0
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^13.0.2
  printing: ^5.14.3
  provider: ^6.1.5+1
  qr_flutter: ^4.0.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  toastification: ^3.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.33.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^3.3.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/GUIDEME.fr.md
    - assets/GUIDEME.en.md

    - assets/icon/icon.png
    - assets/logo_splash.png
    - assets/langs/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic

flutter_native_splash:
  color: "#F4EFE6"
  image: assets/logo_splash.png
  android_12:
    color: "#F4EFE6"
    image: assets/logo_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
